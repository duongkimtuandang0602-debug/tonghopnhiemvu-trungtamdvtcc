:root {

}
body { background: radial-gradient(ellipse at 96% 0%, #EAF6ED 0, transparent 32%), #F8FAF6; color: var(--ink); }

.modalback {background:rgba(6,41,29,.63)}

.modalhead {background:#F2F8F2;border-color:#DEEBDF}

.formfooter {background:#FFFEFC}

.tabbtn {color:#5F806D;border-color:#DCE9E0}
.tabbtn.active {background:#E1F4E8;color:#096A46;border-color:#B3DEBF}
.toast {background:#0C503A;color:white}
.footerbar {color:#889B8D}

const CASE_STATUS={received:'Đã tiếp nhận',reviewing:'Đang thẩm tra',waiting:'Chờ chủ đầu tư bổ sung',ready:'Trình lãnh đạo',returned:'Đã trả hồ sơ',issued:'Đã ban hành'};

const html=(s='')=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate=(s)=>{if(!s)return '—';const p=String(s).split('-');return html(p.length===3?`${p[2]}/${p[1]}/${p[0]}`:String(s))};
const n=(v)=>Number(v)||0;
const money=v=>Math.round(n(v)).toLocaleString('vi-VN')+' đ';
const daydiff=(a,b)=>{if(!a||!b)return 0;return Math.round((Date.parse(b+'T00:00:00Z')-Date.parse(a+'T00:00:00Z'))/86400000)};
const monthStart=m=>`${m}-01`;
const monthEnd=m=>{let [y,mo]=m.split('-').map(Number);return new Date(Date.UTC(y,mo,0)).toISOString().slice(0,10)};
const minDate=(a,b)=>a<b?a:b;

function sample(){return {meta:{version:7,demo:false},settings:{month:today().slice(0,7),asOf:today(),warning:3},tasks:[],cases:[],history:[],reports:[]};}
function read(){try{let d=JSON.parse(localStorage.getItem(STORAGE)||'null');if(d&&Array.isArray(d.tasks)&&Array.isArray(d.cases)&&d.settings)return d;}catch(e){}return sample();}
/* Tháng xem và ngày đối chiếu là lựa chọn riêng của từng người xem, mặc định hôm nay (không đồng bộ, không bị đóng băng) */
const VIEW={month:today().slice(0,7),asOf:today()};
let DB=read(), AUTH=null, page='overview',search='',deptFilter='',statusFilter='',role='',modalItem=null,FINANCE_VISIBLE=false,offlineSaveFail=false;
DB.history=Array.isArray(DB.history)?DB.history:[];DB.reports=Array.isArray(DB.reports)?DB.reports:[];DB.meta=DB.meta||{version:7};
function persist(action='',kind='',id='',detail=''){
 if(!AUTH)return toast('Bạn cần đăng nhập để lưu dữ liệu.');
 DB.meta=DB.meta||{};DB.meta.version=7;
 if(action)DB.history.unshift({id:uid(),at:new Date().toISOString(),action,kind,itemId:id,detail,role:roleName(role),actor:AUTH.username,actorName:AUTH.fullname});
 if(DB.history.length>3000)DB.history.length=3000;
 try{localStorage.setItem(STORAGE,JSON.stringify(DB));offlineSaveFail=false}catch(e){offlineSaveFail=true;console.warn('Không lưu được localStorage:',e)}
 syncSchedule();
 render();
}

function toast(msg){document.querySelector('.toast')?.remove();const t=document.createElement('div');t.className='toast';t.textContent=msg+(offlineSaveFail?' — Không lưu được dữ liệu trong trình duyệt này; hãy xuất bản sao.':'');document.body.append(t);setTimeout(()=>t.remove(),3800)}
function getCutoff(){const m=VIEW.month;return VIEW.asOf<monthStart(m)?null:minDate(VIEW.asOf,monthEnd(m))}
const localDay=iso=>{const d=new Date(iso);return isNaN(d)?String(iso).slice(0,10):d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
function completedBy(t,at){return !!(t.completedAt&&t.completedAt<=at&&t.verifiedAt&&localDay(t.verifiedAt)<=at&&t.approval==='approved')}
function monthTask(t){const m=VIEW.month,start=monthStart(m),cut=getCutoff();if(!cut||t.assignedAt>cut)return '';if(t.assignedAt>=start)return 'MỚI';if(t.assignedAt<start&&!completedBy(t,dayBefore(start)))return 'TỒN';return ''}
function dayBefore(s){return new Date(Date.parse(s+'T00:00:00Z')-86400000).toISOString().slice(0,10)}
function taskStatus(t){const c=getCutoff()||VIEW.asOf;if(t.completedAt&&t.completedAt<=c){if(completedBy(t,c))return t.completedAt>t.dueAt?'HT TRỄ HẠN':'HT ĐÚNG HẠN';return 'CHỜ XÁC NHẬN'}if(t.assignedAt>c)return 'CHƯA ĐẾN NGÀY';if(t.dueAt<c)return 'QUÁ HẠN';if(daydiff(c,t.dueAt)<=n(DB.settings.warning))return 'SẮP HẠN';return 'ĐANG THỰC HIỆN'}
const isApproved=t=>!!(t.verifiedAt&&t.approval==='approved');
const tracked=()=>DB.tasks.filter(t=>monthTask(t));
const pill=(value)=>{let c=/ĐÚNG HẠN|Đã ban hành|Đã xác nhận/.test(value)?'green':/QUÁ HẠN|TRỄ HẠN/.test(value)?'red':/SẮP HẠN|CHỜ|Chờ|Trình/.test(value)?'amber':'blue';return `<span class="pill ${c}">${html(value)}</span>`};
const taskApproved=t=>!!(t.verifiedAt&&t.approval==='approved');
function allowEditTask(t){return canEditTask(t) && (!taskApproved(t)||canCloseReport());}
function allowCreate(){return canFull()||role==='hcth_staff'||isTech();}
function allowApprove(){return canApprove();}
function allowCaseEdit(){return canEditCase();}
function allowFinance(){return canViewFinance();}

function render(){
 const root=document.querySelector('#app');if(!root)return;
 if(!AUTH){loginView();return;}
 if(!canPage(page))page=landingPage();
 const section=(items)=>items.filter(([id])=>canPage(id)).map(([id,ico,name])=>`<button type="button" class="navbtn ${page===id?'active':''}" data-page="${id}"><span>${ico}</span><span>${name}</span></button>`).join('');
 const primary=section(NAV_PRIMARY),secondary=section(NAV_SECONDARY),admin=section(NAV_ADMIN);
 root.innerHTML=`<div class="app"><aside class="sidebar"><div class="mark"><span class="logo">TT</span><div><b>TRUNG TÂM</b><small>Dịch vụ tài chính công Hà Tĩnh</small></div></div>${primary?'<div class="navsection">QUẢN LÝ & ĐIỀU HÀNH</div><nav class="nav">'+primary+'</nav>':''}${secondary?'<div class="navsection">HỒ SƠ & NGUỒN THU</div><nav class="nav">'+secondary+'</nav>':''}${admin?'<div class="navsection">QUẢN TRỊ HỆ THỐNG</div><nav class="nav">'+admin+'</nav>':''}<div class="navfoot"><b>PHẠM VI TRUY CẬP</b><br/>${html(roleName(role))}<br/>Tài khoản: <b>${html(AUTH.username)}</b><br/><span class="smallmuted" id="syncnote">${syncLabel()}</span></div></aside><div class="main"><header class="topbar"><strong>HỆ THỐNG ĐIỀU HÀNH NHIỆM VỤ</strong><div class="right"><span class="chip">● Đã đăng nhập</span><span class="useridentity" style="font-size:12px;color:var(--ink)">${html(AUTH.fullname)}<small style="display:block;color:var(--muted)">${html(roleName(role))}</small></span><button class="btn small" data-action="change-password">Đổi mật khẩu</button><button class="btn small" data-action="logout">Đăng xuất</button></div></header><main class="content">${renderPage()}<div class="footerbar"><span>${ORG} · Hệ thống quản lý nội bộ</span><span>Phiên bản HTML thuần · ${SYNC_URL?'Dữ liệu dùng chung qua máy chủ đồng bộ':'localStorage từng trình duyệt · Không đồng bộ máy khác'}</span></div></main></div></div><div id="modalhost"></div>`;
}

function renderPage(){if(!canPage(page))return '<div class="panel">Không có quyền truy cập.</div>';if(page.startsWith('dept-'))return renderDept(page.slice(5));return ({overview:renderOverview,groups:renderGroups,cases:renderCases,revenue:renderRevenue,approvals:renderApprovals,history:renderHistory,guide:renderGuide,users:renderUsers}[page]||renderOverview)()}
const header=(ey,title,desc,buttons='')=>`<div class="titlebar"><div><div class="eyebrow">${ey}</div><h1>${title}</h1><p>${desc}</p></div><div class="actions">${buttons}</div></div>`;
const btn=(label,act,id='',cls='')=>`<button type="button" class="btn ${cls}" data-action="${act}" ${id?`data-id="${html(id)}"`:''}>${label}</button>`;
function taskCounts(ts){return {total:ts.length,new:ts.filter(t=>monthTask(t)==='MỚI').length,old:ts.filter(t=>monthTask(t)==='TỒN').length,approved:ts.filter(t=>completedBy(t,getCutoff()||VIEW.asOf)).length,overdue:ts.filter(t=>taskStatus(t)==='QUÁ HẠN').length,pending:ts.filter(t=>taskStatus(t)==='CHỜ XÁC NHẬN').length}}
function activeReport(){return DB.reports.find(r=>r.month===VIEW.month)}
function snapshotReport(){const ts=tracked(),s=taskCounts(ts);return {month:VIEW.month,asOf:getCutoff(),tasks:s,received:DB.cases.length,issued:DB.cases.filter(c=>c.status==='issued').length,actual:DB.cases.reduce((v,c)=>v+(c.status==='issued'?n(c.feeActual):0),0),paid:DB.cases.reduce((v,c)=>v+n(c.paid),0)}}
function reportPanel(){const r=activeReport();return `<section class="panel"><div class="panelhead"><div><h2>Trình duyệt và chốt báo cáo tháng</h2><p>Chốt lưu một bản số liệu tại thời điểm duyệt; nhiệm vụ tháng sau tiếp tục theo dõi trên hồ sơ gốc.</p></div><div class="actions">${r?btn('Xem bản báo cáo','view-report','','small'):''}${canSubmitReport()&&(!r||r.status==='reopened')?btn('Trình báo cáo tháng','submit-report','','primary'):''}${canCloseReport()&&r?.status==='submitted'?btn('Lãnh đạo chốt tháng','close-report','','navy'):''}${canCloseReport()&&r?.status==='closed'?btn('Mở lại báo cáo','reopen-report','','danger'):''}</div></div><div class="hint">${r?.status==='closed'?`ĐÃ CHỐT tháng ${html(r.month)} · ${new Date(r.closedAt).toLocaleString('vi-VN')} · Dữ liệu bản chốt được lưu riêng.`:r?.status==='submitted'?`ĐANG CHỜ LÃNH ĐẠO TRUNG TÂM CHỐT tháng ${html(r.month)}.`:r?.status==='reopened'?`Báo cáo đã mở lại, cần trình và chốt lại sau khi rà soát.`:'Chưa trình báo cáo cho tháng đang chọn.'}</div></section>`}
function renderOverview(){const ts=tracked(),st=taskCounts(ts);return `${header('TRUNG TÂM · 03 PHÒNG','Bảng điều hành nhiệm vụ','Tổng hợp trực tiếp từ nhiệm vụ các phòng đã nhập; có thể chuyển tháng để theo dõi nhiệm vụ mới, tồn và kết quả xác nhận.',(allowCreate()?btn('＋ Thêm nhiệm vụ','new-task','','primary'):'')+(canCreateCase()?btn('＋ Tiếp nhận hồ sơ','new-case','','navy'):'')+btn('↓ Excel kẻ bảng','xlsx-tasks')+btn('CSV','export-tasks'))}<section class="box filters"><div class="field"><label>THÁNG CẦN XEM</label><input id="monthpick" type="month" value="${html(VIEW.month)}" /></div><div class="field"><label>NGÀY ĐỐI CHIẾU</label><input id="asofpick" type="date" value="${html(VIEW.asOf)}" /></div><div class="field"><label>CẢNH BÁO TRƯỚC HẠN</label><select id="warningpick">${[1,2,3,5,7,10].map(v=>`<option value="${v}" ${n(DB.settings.warning)===v?'selected':''}>${v} ngày</option>`).join('')}</select></div><div class="field"><label>SAO LƯU</label>${role==='admin'?btn('↓ Sao lưu JSON','export-json'):'<span class="muted">Chỉ admin</span>'}</div></section><div class="kpis"><div class="kpi"><div class="label">TỔNG NHIỆM VỤ ĐANG THEO DÕI</div><div class="num">${st.total}</div><small>${st.new} mới · ${st.old} tồn từ trước</small></div><div class="kpi green"><div class="label">ĐÃ XÁC NHẬN HOÀN THÀNH</div><div class="num">${st.approved}</div><small>Không tự tính việc mới báo xong</small></div><div class="kpi red"><div class="label">NHIỆM VỤ QUÁ HẠN</div><div class="num">${st.overdue}</div><small>Chưa hoàn thành tại mốc báo cáo</small></div><div class="kpi gold"><div class="label">CHỜ LÃNH ĐẠO XÁC NHẬN</div><div class="num">${st.pending}</div><small>Đã báo xong, chưa duyệt</small></div></div><section class="panel"><div class="panelhead"><div><h2>Tình hình thực hiện của từng phòng</h2><p>Bấm vào tên phòng để xem, bổ sung hoặc sửa công việc.</p></div></div><div class="tablewrap"><table class="data-table"><thead><tr><th>Phòng</th><th>Tổng</th><th>Mới</th><th>Tồn</th><th>Đã duyệt</th><th>Quá hạn</th><th>Chờ duyệt</th><th>Tỷ lệ</th></tr></thead><tbody>${DEPTS.map(d=>{let c=taskCounts(ts.filter(t=>t.department===d.id));return `<tr><td>${canPage('dept-'+d.id)?`<button class="linkbtn" data-page="dept-${d.id}">${d.name}</button>`:`<b>${d.name}</b>`}<div class="itemsub">${d.article} · ${GROUPS.filter(g=>g.dept===d.id).length} nhóm tổng thể</div></td><td><b>${c.total}</b></td><td>${c.new}</td><td>${c.old}</td><td>${c.approved}</td><td>${c.overdue}</td><td>${c.pending}</td><td><b style="color:var(--teal)">${c.total?Math.round(c.approved/c.total*100):0}%</b></td></tr>`}).join('')}</tbody></table></div></section>${canSubmitReport()?reportPanel():''}${canPage('cases')?`<div class="split"><section class="panel"><div class="panelhead"><div><h2>Hồ sơ thẩm tra quyết toán</h2><p>Chỉ số lấy từ dữ liệu hồ sơ đã tiếp nhận.</p></div>${btn('Xem hồ sơ','go-cases','','small')}</div><div class="statsline"><div class="statbox"><small>Đã nhận</small><strong>${DB.cases.length}</strong></div><div class="statbox"><small>Đã ban hành</small><strong>${DB.cases.filter(x=>x.status==='issued').length}</strong></div><div class="statbox"><small>Chưa ban hành</small><strong>${DB.cases.filter(x=>x.status!=='issued').length}</strong></div></div></section><section class="panel"><div class="panelhead"><div><h2>Nguồn thu thẩm tra</h2><p>Các khoản tiền do nhân sự nhập, website tự cộng.</p></div>${btn('Xem nguồn thu','go-revenue','','small')}</div><div class="statsline"><div class="statbox"><small>Phí thực tế</small><strong style="font-size:16px">${financeDisplay(DB.cases.reduce((a,x)=>a+(x.status==='issued'?n(x.feeActual):0),0))}</strong></div><div class="statbox"><small>Đã thu</small><strong style="font-size:16px">${financeDisplay(DB.cases.reduce((a,x)=>a+n(x.paid),0))}</strong></div><div class="statbox"><small>Còn phải thu</small><strong style="font-size:16px">${financeDisplay(DB.cases.reduce((a,x)=>a+(x.status==='issued'?Math.max(0,n(x.feeActual)-n(x.paid)):0),0))}</strong></div></div></section></div>`:''}`;}

GROUPS.filter(g=>g.dept===id).map(g=>`<div class="groupcard"><strong>${g.id} · ${html(g.title)}</strong><p>${html(g.detail)}</p><div class="itemsub">${html(g.clauses)}</div></div>`).join('')}</div></section>`}
function renderGroups(){return `${header('CĂN CỨ THEO QUYẾT ĐỊNH 03','Danh mục nhiệm vụ tổng thể','Mã nhóm được giữ ổn định; nội dung công việc cụ thể do các phòng tự nhập. Đây là cách phân loại theo quyết định, không phải danh sách nhiệm vụ tháng.')}<section class="panel"><div class="panelhead"><h2>Danh mục 3 phòng</h2></div>${DEPTS.map(d=>`<h3 style="margin:24px 0 12px">${d.name} · ${d.article}</h3><div class="groupgrid">${GROUPS.filter(g=>g.dept===d.id).map(g=>`<div class="groupcard"><strong>${g.id} · ${html(g.title)}</strong><p>${html(g.detail)}</p><div class="itemsub">Căn cứ: ${html(g.clauses)}</div></div>`).join('')}</div>`).join('')}</section>`}
const caseDays=c=>Math.max(0,daydiff(c.receivedAt,c.status==='issued'&&c.issuedAt?c.issuedAt:c.status==='returned'&&c.returnedAt?c.returnedAt:VIEW.asOf));

function caseTable(cs){return `<div class="tablewrap"><table class="data-table"><thead><tr><th>Hồ sơ / dự án</th><th>Phòng</th><th>Chuyên viên</th><th>Ngày nhận</th><th>Thời gian</th><th>Tình trạng</th><th>Thao tác</th></tr></thead><tbody>${cs.map(c=>`<tr><td><b>${html(c.project)}</b><div class="itemsub">${html(c.code)} · ${html(c.locality||'Địa bàn chưa nhập')}</div></td><td>${html(dept(c.department).short)}</td><td>${html(c.officer)}</td><td>${fmtDate(c.receivedAt)}</td><td><b>${caseDays(c)} ngày</b></td><td>${pill(CASE_STATUS[c.status]||c.status)}</td><td>${btn('Chi tiết','view-case',c.id,'small')} ${canEditCase()?btn('Sửa','edit-case',c.id,'small'):''}</td></tr>`).join('')||`<tr><td colspan="7"><div class="empty"><span>▣</span>Chưa có hồ sơ trong bộ lọc. Bấm “Tiếp nhận hồ sơ” để thêm.</div></td></tr>`}</tbody></table></div>`}
function renderCases(){const cs=caseStats(),items=DB.cases.filter(c=>(!search||(c.project+' '+c.code+' '+c.officer+' '+c.locality+' '+c.investor).toLowerCase().includes(search.toLowerCase()))&&(!deptFilter||c.department===deptFilter)&&(!statusFilter||c.status===statusFilter));return `${header('NGHIỆP VỤ CHUYÊN MÔN','Thẩm tra quyết toán','Hồ sơ được nhập một lần tại bước tiếp nhận. Sau đó sửa, cập nhật tiến độ và xác nhận ban hành trên chính hồ sơ đó.',(canCreateCase()?btn('＋ Tiếp nhận hồ sơ','new-case','','primary'):'')+btn('↓ Excel kẻ bảng','xlsx-cases')+btn('CSV','export-cases'))}<div class="kpis"><div class="kpi"><div class="label">HỒ SƠ ĐÃ TIẾP NHẬN</div><div class="num">${cs.all}</div><small>Không tính trùng khi ban hành</small></div><div class="kpi green"><div class="label">ĐÃ BAN HÀNH</div><div class="num">${cs.issued}</div><small>Đã nhập ngày và số báo cáo</small></div><div class="kpi gold"><div class="label">CHỜ CHỦ ĐẦU TƯ BỔ SUNG</div><div class="num">${cs.waiting}</div><small>Do nhân sự cập nhật</small></div><div class="kpi red"><div class="label">CHƯA BAN HÀNH TRÊN 90 NGÀY</div><div class="num">${cs.old}</div><small>Mốc tham khảo tính từ ngày nhận</small></div></div><section class="panel"><div class="panelhead"><div><h2>Danh sách hồ sơ</h2><p>Địa bàn và chuyên viên nhập linh hoạt. Nút Xuất Excel hồ sơ tạo bảng có kẻ ô, từ danh sách đang lọc.</p></div><div class="subfilters"><input id="casesearch" class="search" placeholder="Tìm dự án, mã hồ sơ, chuyên viên..." value="${html(search)}"/><select id="case-dept"><option value="">Cả 3 phòng</option>${DEPTS.filter(d=>d.id!=='HCTH').map(d=>`<option value="${d.id}" ${deptFilter===d.id?'selected':''}>${d.name}</option>`).join('')}</select><select id="case-status"><option value="">Mọi trạng thái</option>${Object.entries(CASE_STATUS).map(([v,s])=>`<option value="${v}" ${statusFilter===v?'selected':''}>${s}</option>`).join('')}</select></div></div>${caseTable(items)}</section><div class="notice">Thời gian xử lý tự tính từ ngày nhận đến ngày ban hành (nếu đã ban hành), hoặc đến ngày đối chiếu. “Trên 90 ngày” chỉ là tiêu chí tham khảo, không tự kết luận quá hạn theo quy định pháp lý.</div>`}
function renderRevenue(){const actual=DB.cases.reduce((s,c)=>s+(c.status==='issued'?n(c.feeActual):0),0),paid=DB.cases.reduce((s,c)=>s+n(c.paid),0),estimate=DB.cases.reduce((s,c)=>s+n(c.feeEstimate),0);return `${header('NGHIỆP VỤ CHUYÊN MÔN','Theo dõi nguồn thu quyết toán','Nhân sự nhập số tiền và chứng từ theo từng hồ sơ; hệ thống chỉ tự cộng, không tự coi đã thu tiền.',btn(FINANCE_VISIBLE?'Ẩn máy tính nguồn thu':'∑ Mở máy tính nguồn thu','toggle-finance','','primary')+(canViewFinance()?btn('↓ Excel kẻ bảng','xlsx-revenue')+btn('CSV','export-revenue'):''))}<div class="kpis"><div class="kpi"><div class="label">TỔNG PHÍ DỰ KIẾN</div><div class="num" style="font-size:23px">${financeDisplay(estimate)}</div><small>Toàn bộ hồ sơ tiếp nhận</small></div><div class="kpi green"><div class="label">TỔNG PHÍ THỰC TẾ</div><div class="num" style="font-size:23px">${financeDisplay(actual)}</div><small>Chỉ hồ sơ đã ban hành</small></div><div class="kpi"><div class="label">ĐÃ THU</div><div class="num" style="font-size:23px">${financeDisplay(paid)}</div><small>Nhập theo chứng từ thực tế</small></div><div class="kpi gold"><div class="label">CÒN PHẢI THU</div><div class="num" style="font-size:23px">${financeDisplay(Math.max(0,actual-paid))}</div><small>Phí thực tế trừ đã thu</small></div></div><section class="panel"><div class="panelhead"><div><h2>Sổ theo dõi nguồn thu</h2><p>Có thể cập nhật số tiền sau khi hồ sơ được ban hành.</p></div></div><div class="tablewrap"><table class="data-table"><thead><tr><th>Hồ sơ</th><th>Trạng thái</th><th>Phí dự kiến</th><th>Phí thực tế</th><th>Đã thu</th><th>Còn thu</th><th>Thao tác</th></tr></thead><tbody>${DB.cases.map(c=>`<tr><td><b>${html(c.project)}</b><div class="itemsub">${html(c.code)} · ${html(c.invoiceNo||'Chưa ghi số hóa đơn')}</div></td><td>${pill(CASE_STATUS[c.status])}</td><td>${financeDisplay(c.feeEstimate)}</td><td>${c.status==='issued'?financeDisplay(c.feeActual):'—'}</td><td>${financeDisplay(c.paid)}</td><td>${c.status==='issued'?financeDisplay(Math.max(0,n(c.feeActual)-n(c.paid))):'—'}</td><td>${canUpdateFinance()?btn('Cập nhật thu','payment',c.id,'small'):'—'}</td></tr>`).join('')||'<tr><td colspan="7"><div class="empty">Chưa có hồ sơ.</div></td></tr>'}</tbody></table></div></section><div class="notice">Mục nguồn thu là số liệu kế toán theo thông tin được nhập. Cần có chứng từ và xác nhận của người có thẩm quyền để sử dụng làm báo cáo chính thức.</div>`}

function renderHistory(){const events=DB.history.slice(0,100);return `${header('KIỂM SOÁT & TRA CỨU','Lịch sử cập nhật','Lưu lại các thao tác chỉnh sửa, phê duyệt và cập nhật tài chính trong hệ thống.',btn('↓ Xuất sao lưu','export-json','','primary'))}<section class="panel"><div class="timeline">${events.map(h=>`<div class="event"><b>${html(h.action)} · ${html(h.kind)}</b><small>${new Date(h.at).toLocaleString('vi-VN')} · ${html(h.actorName||h.actor||h.role||'')} · ${html(h.itemId||'')}</small><div class="muted" style="font-size:12px">${html(h.detail||'')}</div></div>`).join('')||'<div class="empty">Chưa có lịch sử. Thử tạo hoặc sửa một nhiệm vụ để xem.</div>'}</div></section>`}
function renderGuide(){return `${header('HƯỚNG DẪN','Quy trình sử dụng','Các phòng nhập liệu trực tiếp vào hệ thống dùng chung. Những bước xác nhận và chốt báo cáo thực hiện theo đúng tài khoản được cấp.')}<div class="split"><section class="panel"><h2>01 · Giao và thực hiện nhiệm vụ</h2><p class="muted" style="line-height:1.9;margin-top:12px">Vào trang phòng → <b>Thêm nhiệm vụ</b> → chọn mã nhóm, nhập nội dung, người phụ trách, ngày giao và hạn. Khi có thay đổi, chọn <b>Sửa</b>. Nhân sự nhập ngày hoàn thành và minh chứng; lãnh đạo xác nhận sau khi kiểm tra.</p></section><section class="panel"><h2>02 · Theo dõi hồ sơ thẩm tra</h2><p class="muted" style="line-height:1.9;margin-top:12px">Bấm <b>Tiếp nhận hồ sơ</b> và nhập các thông tin thực tế. Sau khi lưu, sửa tiến độ trên đúng mã hồ sơ; lúc ban hành, người có thẩm quyền cập nhật số báo cáo và ngày ban hành. Không lập thêm hồ sơ trùng.</p></section></div><div class="split"><section class="panel"><h2>03 · Nguồn thu và thời gian xử lý</h2><p class="muted" style="line-height:1.9;margin-top:12px">Ngày nhận, ngày ban hành, phí dự kiến, phí thực tế và số đã thu được nhập theo thực tế, chứng từ. Hệ thống tự tính số ngày xử lý, tổng nguồn thu và số còn phải thu. Chỉ người có quyền được mở tổng tiền và xuất báo cáo nguồn thu.</p></section><section class="panel"><h2>04 · Phê duyệt, chốt tháng và sao lưu</h2><p class="muted" style="line-height:1.9;margin-top:12px">HCTH tổng hợp và trình báo cáo; lãnh đạo Trung tâm chốt kết quả tháng. Mỗi người đăng nhập bằng tài khoản riêng. CNTT cần sao lưu máy chủ định kỳ, lưu bản sao ở nơi an toàn và kiểm tra khôi phục theo quy trình nội bộ.</p></section></div><section class="panel"><h2>Xuất báo cáo</h2><p class="muted" style="margin:12px 0 17px">Xuất Excel có tiêu đề, đường kẻ ô, bộ lọc, định dạng ngày và tiền. Dùng CSV khi cần xử lý dữ liệu thô. Các báo cáo chỉ gồm dữ liệu mà tài khoản có quyền xem.</p><div class="actions">${canPage('overview')?btn('↓ Excel nhiệm vụ','xlsx-tasks','','primary')+btn('↓ CSV nhiệm vụ','export-tasks'):''}${canPage('cases')?btn('↓ Excel hồ sơ','xlsx-cases')+btn('↓ CSV hồ sơ','export-cases'):''}${canViewFinance()?btn('↓ Excel nguồn thu','xlsx-revenue')+btn('↓ CSV nguồn thu','export-revenue'):''}</div></section><div class="notice">Danh mục nhóm nhiệm vụ được hệ thống hóa theo Quyết định 03/QĐ-TrT ngày 14/8/2026. Nội dung địa bàn, dự án, chủ đầu tư, người phụ trách được nhập linh hoạt theo công việc phát sinh. Trước khi sử dụng chính thức với dữ liệu công vụ, quản trị viên phải bảo đảm phương án lưu trữ và bảo mật được phê duyệt.</div>`}

// CSV cho Excel: dữ liệu tiếng Việt, phân cột bằng dấu ;, UTF-8 BOM.
// Không đưa mã nội bộ, khóa kỹ thuật hoặc cột thừa vào bản báo cáo.
function csvSafeText(v){
  let s=String(v??'').replace(/[\r\n\t]+/g,' · ').replace(/\s{2,}/g,' ').trim();
  // Ngăn Excel diễn giải nội dung do người dùng nhập thành công thức.
  if(/^[=+@-]/.test(s))s="'"+s;
  return s;
}
function csvEscape(v){return '"'+csvSafeText(v).replace(/"/g,'""')+'"'}
function csvMoney(v){return Number.isFinite(Number(v))?String(Math.round(Number(v))):''}
function csvDate(v){return v?fmtDate(v):''}
function csvApproval(t){return isApproved(t)?'Đã xác nhận':t.completedAt?'Chờ xác nhận':'Chưa trình duyệt'}
function csvText(v){return v==null?'':String(v)}
function csvSortTasks(a,b){return DEPTS.findIndex(d=>d.id===a.department)-DEPTS.findIndex(d=>d.id===b.department) || (a.dueAt||'9999').localeCompare(b.dueAt||'9999') || (a.assignedAt||'').localeCompare(b.assignedAt||'') || (a.title||'').localeCompare(b.title||'','vi')}
function csvSortCases(a,b){return (b.receivedAt||'').localeCompare(a.receivedAt||'')||(a.code||'').localeCompare(b.code||'')}
function csvMakeFile(filename,headers,rows){
 const sep=';';
 const lines=[headers,...rows].map(row=>row.map((x,i)=>typeof x==='number'?csvMoney(x):csvEscape(x)).join(sep));
 const csv='\ufeffsep=;\r\n'+lines.join('\r\n')+'\r\n';
 downloadFile(filename,csv,'text/csv;charset=utf-8');
 toast(`Đã xuất ${rows.length} dòng. Mở bằng Excel để lọc và sắp xếp theo cột.`);
}

  if(page.startsWith('dept-')&&department){

function syncLabel(){if(!SYNC_URL)return 'Dữ liệu lưu tại trình duyệt này.';const t=SYNC.lastOk?new Date(SYNC.lastOk).toLocaleTimeString('vi-VN'):'—';return SYNC.status==='error'?'⚠ Mất kết nối máy chủ, thay đổi sẽ gửi lại khi có mạng.':SYNC.dirty||SYNC.busy?'⟳ Đang đồng bộ dữ liệu…':'✓ Dữ liệu dùng chung · đồng bộ lúc '+t}
function syncPaint(){const el=document.querySelector('#syncnote');if(el)el.textContent=syncLabel()}
function syncDoc(){return {db:DB,users:getUsers()}}
const jsonEq=(a,b)=>JSON.stringify(a)===JSON.stringify(b);
function mergeList(base,local,remote,key){
 const k=x=>x?.[key],B=new Map((base||[]).map(x=>[k(x),x])),L=new Map((local||[]).map(x=>[k(x),x]));
 const out=[],seen=new Set();
 for(const r of remote||[]){const id=k(r);seen.add(id);if(B.has(id)&&!L.has(id))continue;const l=L.get(id),b=B.get(id);if(!l||!b||jsonEq(l,b)){out.push(r);continue}const m={...r};for(const f of new Set([...Object.keys(l),...Object.keys(b)]))if(!jsonEq(l[f],b[f])){if(f in l)m[f]=l[f];else delete m[f]}out.push(m)}
 for(const l of local||[]){const id=k(l);if(seen.has(id))continue;if(!B.has(id)||!jsonEq(l,B.get(id)))out.push(l)}
 return out;
}
function mergeDoc(base,local,remote){
 base=base||{db:{},users:[]};const b=base.db||{},l=local.db,r=remote.db||sample();
 const db={...r,meta:r.meta||l.meta,
  settings:jsonEq(l.settings,b.settings)?r.settings:l.settings,
  tasks:mergeList(b.tasks,l.tasks,r.tasks,'id'),cases:mergeList(b.cases,l.cases,r.cases,'id'),
  reports:mergeList(b.reports,l.reports,r.reports,'month'),
  history:mergeList(b.history,l.history,r.history,'id').sort((x,y)=>String(y.at).localeCompare(String(x.at))).slice(0,3000)};
 return {db,users:mergeList(base.users,local.users,remote.users||[],'id')};
}
function adoptDoc(doc){
 const d=doc?.db;DB=(d&&Array.isArray(d.tasks)&&Array.isArray(d.cases)&&d.settings)?d:sample();
 DB.history=Array.isArray(DB.history)?DB.history:[];DB.reports=Array.isArray(DB.reports)?DB.reports:[];DB.meta=DB.meta||{version:7};
 try{localStorage.setItem(STORAGE,JSON.stringify(DB))}catch(e){}
 saveUsers(Array.isArray(doc?.users)?doc.users:[],false);
 if(AUTH){const me=currentSession();if(!me){signOut();toast('Phiên đăng nhập đã hết hiệu lực (tài khoản bị khóa hoặc đổi mật khẩu).');return}AUTH=me;role=me.role}
}
/* Form đang mở giữ tham chiếu tới bản ghi cũ: không thay DB lúc này, đợi đóng form rồi mới đồng bộ */
const modalOpen=()=>!!document.querySelector('#modalback');
function softRender(){if(!AUTH)return;if(document.querySelector('#modalback'))return;const a=document.activeElement;if(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))return;render()}
async function syncCall(payload){
 const ctrl=new AbortController(),t=setTimeout(()=>ctrl.abort(),20000);
 try{const res=payload?await fetch(SYNC_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload),signal:ctrl.signal}):await fetch(SYNC_URL+(SYNC_URL.includes('?')?'&':'?')+'action=get&t='+Date.now(),{signal:ctrl.signal});
  if(!res.ok)throw Error('HTTP '+res.status);const j=await res.json();if(!j||j.ok===undefined)throw Error('Phản hồi máy chủ không hợp lệ');return j}
 finally{clearTimeout(t)}
}
/* Lấy bản mới nhất; nếu máy này có thay đổi chưa gửi thì gộp rồi đẩy lên */
async function syncPull(force=false){
 if(!SYNC_URL||SYNC.busy||(!force&&modalOpen()))return;SYNC.busy=true;syncPaint();
 try{const j=await syncCall(null);if(!j.ok)throw Error(j.error||'Lỗi máy chủ');
  const remote=j.doc||{db:sample(),users:[]};
  if(!force&&modalOpen()){SYNC.status='ok';return}
  if(SYNC.dirty){const merged=mergeDoc(SYNC.base,syncDoc(),remote);SYNC.base=remote;SYNC.rev=j.rev;adoptDoc(merged);SYNC.busy=false;await syncPush();return}
  if(force||j.rev!==SYNC.rev||!SYNC.base){SYNC.rev=j.rev;SYNC.base=remote;adoptDoc(remote);softRender()}
  SYNC.status='ok';SYNC.lastOk=new Date().toISOString();
 }catch(e){SYNC.status='error';console.warn('Đồng bộ thất bại:',e);throw e}
 finally{SYNC.busy=false;syncSave();syncPaint()}
}
async function syncPush(attempt=0){
 if(!SYNC_URL)return;if(SYNC.busy||modalOpen()){clearTimeout(SYNC.timer);SYNC.timer=setTimeout(()=>syncPush(),1500);return}SYNC.busy=true;syncPaint();
 const doc=clone(syncDoc());
 try{const j=await syncCall({action:'put',baseRev:SYNC.rev,doc});
  if(j.ok){SYNC.rev=j.rev;SYNC.base=doc;SYNC.dirty=!jsonEq(syncDoc(),doc);SYNC.status='ok';SYNC.lastOk=new Date().toISOString()}
  else if(j.conflict&&modalOpen()){SYNC.status='ok';clearTimeout(SYNC.timer);SYNC.timer=setTimeout(()=>syncPush(),1500)}
  else if(j.conflict&&attempt<4){const merged=mergeDoc(SYNC.base,syncDoc(),j.doc);SYNC.base=j.doc;SYNC.rev=j.rev;adoptDoc(merged);SYNC.busy=false;await syncPush(attempt+1);softRender();return}
  else throw Error(j.error||'Không ghi được dữ liệu');
 }catch(e){SYNC.status='error';console.warn('Đồng bộ thất bại:',e)}
 finally{SYNC.busy=false;syncSave();syncPaint();if(SYNC.dirty&&SYNC.status==='ok')syncSchedule()}
}
function syncSchedule(){if(!SYNC_URL)return;SYNC.dirty=true;syncSave();syncPaint();clearTimeout(SYNC.timer);SYNC.timer=setTimeout(()=>syncPush(),700)}
function syncStart(){
 if(!SYNC_URL)return;
 setInterval(()=>{if(SYNC.dirty&&SYNC.status==='error')syncPush();else syncPull().catch(()=>{})},SYNC_INTERVAL);
 document.addEventListener('visibilitychange',()=>{if(!document.hidden)syncPull().catch(()=>{})});
 window.addEventListener('beforeunload',e=>{if(SYNC.dirty){e.preventDefault();e.returnValue=''}});
}

function getUsers(){try{const users=JSON.parse(localStorage.getItem(USERS_KEY)||'[]');if(!Array.isArray(users))return [];users.forEach(u=>{if(LEGACY_ROLE[u.role])u.role=LEGACY_ROLE[u.role];delete u.sessionToken});return users}catch(e){return []}}
function saveUsers(users,sync=true){users.forEach(u=>delete u.sessionToken);localStorage.setItem(USERS_KEY,JSON.stringify(users));if(sync)syncSchedule()}
/* Tạo sẵn admin mặc định từ config.js khi hệ thống chưa có tài khoản nào (thay cho màn hình thiết lập lần đầu) */
function ensureDefaultAdmin(){const users=getUsers(),a=window.APP_CONFIG?.DEFAULT_ADMIN;if(!a?.username||!a?.salt||!a?.passwordHash)throw Error('Thiếu DEFAULT_ADMIN trong config.js');const aid=a.id||'ADMIN-DEFAULT';if(users.some(u=>u.id===aid||u.username===a.username))return;if(SYNC_URL&&!SYNC.base)return;saveUsers([...users,{id:a.id||'ADMIN-DEFAULT',username:a.username,fullname:a.fullname||'Quản trị hệ thống',role:'admin',salt:a.salt,passwordHash:a.passwordHash,active:true,createdAt:new Date().toISOString(),lastLoginAt:'',loginCount:0}],false);if(SYNC_URL&&!(SYNC.base?.users?.length))syncSchedule()}
function authSalt(){const a=new Uint8Array(20);crypto.getRandomValues(a);return Array.from(a,x=>x.toString(16).padStart(2,'0')).join('')}
async function hashPassword(password,salt){
 if(!globalThis.crypto?.subtle)throw Error('Trình duyệt không hỗ trợ mã hóa mật khẩu. Hãy dùng Chrome/Edge và mở từ file hoặc HTTPS.');
 const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveBits']);
 const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:new TextEncoder().encode(salt),iterations:130000,hash:'SHA-256'},k,256);
 return Array.from(new Uint8Array(bits),x=>x.toString(16).padStart(2,'0')).join('');
}
function validUsername(value){return /^[a-z0-9._-]{3,32}$/.test(value)}
function currentSession(){
 try{const session=JSON.parse(sessionStorage.getItem(SESSION_KEY)||'null');
  if(!session)return null;return getUsers().find(u=>u.id===session.id&&u.active&&String(u.passwordHash||'').slice(0,24)===session.sig)||null;
 }catch(e){return null}
}
function establishSession(user){
 const users=getUsers();const u=users.find(x=>x.id===user.id);if(!u||!u.active)throw Error('Tài khoản chưa được kích hoạt');
 u.lastLoginAt=new Date().toISOString();u.loginCount=(u.loginCount||0)+1;saveUsers(users);
 sessionStorage.setItem(SESSION_KEY,JSON.stringify({id:u.id,sig:String(u.passwordHash).slice(0,24)}));
 AUTH=u;role=u.role;FINANCE_VISIBLE=false;page=landingPage();render();
}

function userForm(id=''){

 const old=getUsers().find(u=>u.id===id),u=old||{username:'',fullname:'',role:'hcth_staff',active:true};

 document.querySelector('#user-form').addEventListener('submit',async e=>{e.preventDefault();if(role!=='admin')return;const f=e.currentTarget,v=Object.fromEntries(new FormData(f).entries());const username=(old?old.username:v.username).trim().toLowerCase(),fullname=(v.fullname||'').trim();if(!validUsername(username)||!fullname)return toast('Kiểm tra lại tên đăng nhập và họ tên.');if(!ROLE_LABELS[v.role]&&!(old?.id===AUTH.id))return toast('Vai trò không hợp lệ.');const users=getUsers();if(!old&&users.some(x=>x.username===username))return toast('Tên đăng nhập đã tồn tại.');if(old){const target=users.find(x=>x.id===id);if(!target)return;const nextRole=old.id===AUTH.id?'admin':v.role;if(target.role==='admin'&&nextRole!=='admin'&&users.filter(x=>x.role==='admin'&&x.active).length<=1)return toast('Không thể hạ quyền admin đang hoạt động cuối cùng.');target.fullname=fullname;target.role=nextRole;target.updatedAt=new Date().toISOString();saveUsers(users);if(target.id===AUTH.id){AUTH=target;role=target.role}closeModal();persist('Điều chỉnh tài khoản','Người dùng',id,`${username} · ${roleName(nextRole)}`);toast('Đã cập nhật phân quyền. Tài khoản cần đăng nhập lại để thấy quyền mới.');return}if(v.password.length<8)return toast('Mật khẩu tối thiểu 8 ký tự.');try{const salt=authSalt(),passwordHash=await hashPassword(v.password,salt),newUser={id:uid(),username,fullname,role:v.role,salt,passwordHash,active:true,createdAt:new Date().toISOString(),lastLoginAt:'',loginCount:0,sessionToken:''};users.push(newUser);saveUsers(users);closeModal();persist('Cấp tài khoản mới','Người dùng',newUser.id,`${username} · ${roleName(v.role)}`);toast('Đã cấp tài khoản '+username)}catch(ex){toast(ex.message)}});

function toggleUser(id){if(role!=='admin'||id===AUTH.id)return toast('Không thể khóa tài khoản của chính mình.');const users=getUsers(),u=users.find(x=>x.id===id);if(!u)return;if(u.role==='admin'&&u.active&&users.filter(x=>x.role==='admin'&&x.active).length===1)return toast('Cần còn ít nhất một admin hoạt động.');if(!confirm((u.active?'Khóa':'Mở khóa')+' tài khoản '+u.username+'?'))return;u.active=!u.active;u.sessionToken='';u.updatedAt=new Date().toISOString();saveUsers(users);persist(u.active?'Mở khóa tài khoản':'Khóa tài khoản','Người dùng',u.id,u.username);toast('Đã cập nhật trạng thái tài khoản')}
function resetUserPassword(id){if(role!=='admin')return toast('Chỉ admin được đặt lại mật khẩu.');const u=getUsers().find(x=>x.id===id);if(!u)return;modal('Đặt lại mật khẩu',`Tài khoản: ${html(u.username)} · ${html(u.fullname)}`,`<form id="reset-user-form"><div class="formgrid">${formField('Mật khẩu mới (tối thiểu 8 ký tự)','password','','password',true,'minlength="8"')}${formField('Nhập lại mật khẩu mới','confirm','','password',true,'minlength="8"')}</div><div class="formfooter" style="padding:20px 0 0">${btn('Hủy','close-modal')}<button class="btn primary" type="submit">Lưu mật khẩu mới</button></div></form>`);document.querySelector('#reset-user-form').onsubmit=async e=>{e.preventDefault();const f=e.currentTarget;if(f.elements.password.value.length<8||f.elements.password.value!==f.elements.confirm.value)return toast('Hai mật khẩu phải giống nhau, dài ít nhất 8 ký tự.');try{const users=getUsers(),target=users.find(x=>x.id===id),salt=authSalt();target.salt=salt;target.passwordHash=await hashPassword(f.elements.password.value,salt);target.sessionToken='';target.updatedAt=new Date().toISOString();saveUsers(users);closeModal();persist('Đặt lại mật khẩu','Người dùng',id,target.username);toast('Đã đổi mật khẩu. Tài khoản đăng nhập lại bằng mật khẩu mới.');if(id===AUTH.id)signOut()}catch(ex){toast('Không đặt lại mật khẩu: '+ex.message)}}}
function changeMyPassword(){if(!AUTH)return;modal('Đổi mật khẩu cá nhân',`@${html(AUTH.username)}`,`<form id="my-password-form"><div class="formgrid">${formField('Mật khẩu hiện tại','old','','password',true)}${formField('Mật khẩu mới (tối thiểu 8 ký tự)','password','','password',true,'minlength="8"')}${formField('Nhập lại mật khẩu mới','confirm','','password',true,'minlength="8"')}</div><div class="formfooter" style="padding:20px 0 0">${btn('Hủy','close-modal')}<button class="btn primary" type="submit">Đổi mật khẩu</button></div></form>`);document.querySelector('#my-password-form').onsubmit=async e=>{e.preventDefault();const f=e.currentTarget;if(f.elements.password.value.length<8||f.elements.password.value!==f.elements.confirm.value)return toast('Mật khẩu mới phải có ít nhất 8 ký tự và hai lần nhập giống nhau.');const users=getUsers(),u=users.find(x=>x.id===AUTH.id);try{if(await hashPassword(f.elements.old.value,u.salt)!==u.passwordHash)return toast('Mật khẩu hiện tại không chính xác.');u.salt=authSalt();u.passwordHash=await hashPassword(f.elements.password.value,u.salt);u.sessionToken='';u.updatedAt=new Date().toISOString();saveUsers(users);closeModal();persist('Đổi mật khẩu cá nhân','Người dùng',u.id,u.username);signOut();toast('Đã đổi mật khẩu. Vui lòng đăng nhập lại.')}catch(ex){toast(ex.message)}}}
function canRunAction(a,id){if(!AUTH)return false;
 if(['new-user','edit-user','reset-user-password','toggle-user','import-json','export-json','delete-task','delete-case'].includes(a))return role==='admin';
 if(['new-task'].includes(a))return allowCreate()&&(!id||canCreateTask(id));
 if(['edit-task'].includes(a))return canEditTask(DB.tasks.find(t=>t.id===id));
 if(['view-task'].includes(a))return canPage('dept-'+(DB.tasks.find(t=>t.id===id)?.department||''));
 if(['verify-task'].includes(a))return canApprove();
 if(['reopen-task','close-report','reopen-report'].includes(a))return canCloseReport();
 if(['new-case','edit-case'].includes(a))return canCreateCase();
 if(['view-case','go-cases','xlsx-cases','export-cases'].includes(a))return canPage('cases');
 if(['issue-case'].includes(a))return canApprove();
 if(['payment'].includes(a))return canUpdateFinance();
 if(['go-revenue','toggle-finance','xlsx-revenue','export-revenue'].includes(a))return canViewFinance();
 if(['xlsx-tasks','export-tasks'].includes(a))return canAccessTaskExport(id||'');
 if(['submit-report','view-report'].includes(a))return canSubmitReport();
 return true;
}

function actionClick(e){
 const p=e.target.closest('[data-page]');if(p){if(!canPage(p.dataset.page))return toast('Tài khoản không có quyền mở mục này.');page=p.dataset.page;search='';statusFilter='';deptFilter='';FINANCE_VISIBLE=false;render();window.scrollTo(0,0);return;}
 const el=e.target.closest('[data-action]');if(!el)return;
 const a=el.dataset.action,id=el.dataset.id||'';
 if(!canRunAction(a,id))return toast('Tài khoản không được cấp quyền thực hiện thao tác này.');
 switch(a){
 case 'submit-report':submitReport();break;case 'close-report':closeReport();break;case 'view-report':viewReport();break;case 'reopen-report':reopenReport();break;
 case 'new-task':openTaskForm('',id||(isTech()?'DVC':'HCTH'));break;case 'edit-task':closeModal();openTaskForm(id);break;case 'view-task':taskDetails(id);break;case 'verify-task':taskVerify(id);break;case 'reopen-task':taskReopen(id);break;
 case 'new-case':openCaseForm();break;case 'edit-case':closeModal();openCaseForm(id);break;case 'view-case':caseDetails(id);break;case 'issue-case':closeModal();issueForm(id);break;case 'payment':closeModal();paymentForm(id);break;
 case 'close-modal':closeModal();break;case 'go-cases':page='cases';render();break;case 'go-revenue':page='revenue';render();break;
 case 'toggle-finance':FINANCE_VISIBLE=!FINANCE_VISIBLE;render();break;
 case 'export-json':downloadFile('SAO_LUU_WEB_TRUNG_TAM_'+today()+'.json',JSON.stringify(DB,null,2),'application/json;charset=utf-8');toast('Đã xuất bản sao dữ liệu nhiệm vụ và hồ sơ. Lưu giữ an toàn.');break;
 case 'xlsx-tasks':exportXLSX('tasks',id);break;case 'export-tasks':exportCSV('tasks',id);break;case 'xlsx-cases':exportXLSX('cases');break;case 'export-cases':exportCSV('cases');break;case 'xlsx-revenue':exportXLSX('revenue');break;case 'export-revenue':exportCSV('revenue');break;
 case 'import-json':document.querySelector('#import-input')?.click();break;
 case 'new-user':userForm();break;case 'edit-user':userForm(id);break;case 'reset-user-password':resetUserPassword(id);break;case 'toggle-user':toggleUser(id);break;
 case 'change-password':changeMyPassword();break;case 'logout':signOut();break;
 case 'reset':return toast('Không hỗ trợ xóa trắng dữ liệu đang vận hành');
 case 'delete-task':{const t=DB.tasks.find(x=>x.id===id);if(!t)return;if(confirm('Xóa nhiệm vụ '+t.title+'?')){DB.tasks=DB.tasks.filter(x=>x.id!==id);closeModal();persist('Xóa nhiệm vụ','Nhiệm vụ',id,t.title)}break;}
 case 'delete-case':{const c=DB.cases.find(x=>x.id===id);if(!c)return;if(confirm('Xóa hồ sơ '+c.code+'?')){DB.cases=DB.cases.filter(x=>x.id!==id);closeModal();persist('Xóa hồ sơ','Hồ sơ',id,c.code)}break;}
 }
}

function dataChange(e){const el=e.target;
 if(!AUTH)return;
 if(el.id==='monthpick'||el.id==='asofpick'||el.id==='warningpick'){
  if(el.id==='monthpick'&&el.value)VIEW.month=el.value;
  if(el.id==='asofpick'&&el.value)VIEW.asOf=el.value;
  if(el.id==='warningpick'){DB.settings.warning=Number(el.value);persist();return}
  render();return;
 }
 if(el.id==='taskstatus'||el.id==='case-status'){statusFilter=el.value;render();return}
 if(el.id==='case-dept'){deptFilter=el.value;render();return}
 if(el.id==='import-input'){
  if(role!=='admin')return toast('Chỉ admin được khôi phục dữ liệu.');
  const f=el.files[0];if(!f)return;
  f.text().then(t=>{
   let x;try{x=JSON.parse(t)}catch(e){return toast('File JSON không hợp lệ')}
   if(!Array.isArray(x.tasks)||!Array.isArray(x.cases)||!x.settings)return toast('Bản sao không đúng cấu trúc dữ liệu nghiệp vụ.');
   if(!confirm('Thao tác sẽ THAY THẾ toàn bộ nhiệm vụ, hồ sơ, lịch sử và báo cáo đang lưu trên trình duyệt. Hãy sao lưu trước. Tiếp tục?'))return;
   DB=x;DB.history=Array.isArray(DB.history)?DB.history:[];DB.reports=Array.isArray(DB.reports)?DB.reports:[];DB.meta=DB.meta||{version:7};DB.settings={month:today().slice(0,7),asOf:today(),warning:3,...(typeof DB.settings==='object'?DB.settings:{})};DB.settings.warning=Number(DB.settings.warning)||3;
   page='overview';persist('Khôi phục dữ liệu JSON','Hệ thống','','Nhập dữ liệu từ bản sao');toast('Đã nhập dữ liệu nghiệp vụ; tài khoản không bị thay đổi.');
  }).catch(()=>toast('Không đọc được file JSON'));
  return;
 }
}

function searchInput(e){const el=e.target;if(!['tasksearch','casesearch'].includes(el.id))return;let pos=el.selectionStart;search=el.value;render();const newEl=document.getElementById(el.id);if(newEl){newEl.focus();try{newEl.setSelectionRange(pos,pos)}catch{}}}
async function init(){
 document.addEventListener('click',actionClick);
 document.addEventListener('change',dataChange);
 document.addEventListener('input',searchInput);
 document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
 if(SYNC_URL){document.querySelector('#app').innerHTML='<div class="auth-shell"><section class="auth-card"><div class="auth-title"><h1>Đang tải dữ liệu…</h1><p>Đang kết nối máy chủ lưu trữ dùng chung.</p></div></section></div>';
  try{await syncPull(true)}catch(e){toast('Không kết nối được máy chủ dữ liệu, đang dùng bản lưu trên máy này.')}
  if(SYNC.dirty)syncPush();syncStart()}
 try{ensureDefaultAdmin()}catch(e){console.error(e)}
 AUTH=currentSession();role=AUTH?.role||'';page=AUTH?landingPage():'overview';render();
}

if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
</script></body></html>
